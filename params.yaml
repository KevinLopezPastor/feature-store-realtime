validate:
  # Gate tolerance: drop invalid rows below this fraction of the data, fail the flow at or above it.
  max_invalid_fraction: 0.05

ingest:
  # Columns read from the Parquet files; must cover the schema (zones) and everything features uses.
  columns:
    - tpep_pickup_datetime
    - PULocationID
    - DOLocationID
    - VendorID
    - RatecodeID
    - passenger_count

train:
  cutoff_date: "2024-03-01"
  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42

evaluate:
  # Upper bound (minutes) for the secondary RMSE; fixed so every model and data version is scored the same way.
  duration_cap_min: 120.0

register:
  # Week 2's own registry entry: its models take Feast features, so they never share a name (or @champion) with week 1's 7-feature models.
  model_name: "nyc-taxi-duration-lgbm-feast"
  primary_metric: "mae"
  # false: week 2's first model must NOT become @champion on its own. jobs/retrain.py sets the alias
  # after comparing against week 1's @champion on the same rows.
  auto_promote_first: false
  # Challenger must beat the champion by this fraction: new < champ * (1 - margin).
  relative_margin: 0.01