[project]
name = "feature-store-realtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "kevinlopez.ind@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.0,<0.151.0",
    "feast[redis]>=0.67.0",
    "grpcio-health-checking>=1.85.1",
    "grpcio-reflection>=1.85.1",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "mlops-reproducible-pipeline",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=25.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
feature-store-realtime = "feature_store_realtime:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio>=1.85.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# `jobs` and `service` are top-level folders, not part of the installed package: the repo root must be on sys.path.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
mlops-reproducible-pipeline = { path = "/mnt/d/MLOp_projects/mlops-reproducible-pipeline" }
